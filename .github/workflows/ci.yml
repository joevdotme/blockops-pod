name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundry:
    name: Foundry
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Cache Foundry build output
        uses: actions/cache@v4
        with:
          path: |
            cache
            out
          key: foundry-${{ runner.os }}-${{ hashFiles('foundry.toml', 'src/**/*.sol', 'script/**/*.sol', 'test/**/*.sol') }}
          restore-keys: |
            foundry-${{ runner.os }}-

      - name: Show toolchain versions
        run: |
          forge --version
          cast --version
          anvil --version

      - name: Check formatting
        run: make fmt-check

      - name: Build
        run: make build

      - name: Test
        run: make test
