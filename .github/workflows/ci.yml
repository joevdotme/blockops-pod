name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundry:
    name: Foundry
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Cache Foundry build output
        uses: actions/cache@v4
        with:
          path: |
            cache
            out
          key: foundry-${{ runner.os }}-${{ hashFiles('foundry.toml', 'src/**/*.sol', 'script/**/*.sol', 'test/**/*.sol') }}
          restore-keys: |
            foundry-${{ runner.os }}-

      - name: Show toolchain versions
        run: |
          forge --version
          cast --version
          anvil --version

      - name: Check formatting
        run: make fmt-check

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Start local Anvil chain
        run: |
          anvil --host 127.0.0.1 --port 8545 > /tmp/anvil.log 2>&1 &
          echo $! > /tmp/anvil.pid
          sleep 2

      - name: Generate manifest and simulate deployment
        run: make simulate-local

      - name: Upload simulation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blockops-simulation
          path: |
            deployments/
            simulations/
          if-no-files-found: error
